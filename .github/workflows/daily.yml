name: 🛡 Cyber Daily Automation

on:
  schedule:
    # Runs every day at 20:00 UTC
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

# Prevent two runs from modifying the README simultaneously
concurrency:
  group: cyber-daily-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Generate Documentation & Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: 🧠 Generate documentation
        run: |
          python .github/scripts/update_readme.py

      - name: 🔍 Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit -m "docs: regenerate dashboard ($(date -u +'%Y-%m-%d'))"

      - name: 🚀 Push changes
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: ✅ Done
        run: echo "Cyber dashboard updated successfully."
